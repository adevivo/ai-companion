org.gradle.jvmargs = -Xmx3G

mod_name = AiCompanion
mod_version = 0.4.0
maven_group = com.neovetta.aicompanion

minecraft_version = 1.21.11

# Mojang's own names, with Parchment layered on for parameter names. Not Quilt Mappings: QuiltMC
# stopped once Mojang announced unobfuscation, so 1.21.11+build.2 is the end of that line, and the
# engine is on Mojmap anyway. One namespace across both halves of the mod is worth having.
parchment_version = 2025.12.20

fabric_loader_version = 0.17.2
fabric_api_version = 0.141.1+1.21.11

# Architectury API. Not a multi-loader ambition on our part — the engine is an Architectury mod and
# its networking is Architectury's, so the mod half of every channel has to speak the same API.
architectury_api_version = 19.0.1

# In-game config UI. Versions verified against their own metadata for 1.21.11, not inferred from
# the version numbers: Cloth's 21.11.x line names the Minecraft version, but Mod Menu's does not —
# 17.0.0 is the 1.21.11 release, and the higher 20.x releases target later Minecraft.
cloth_config_version = 21.11.153
modmenu_version = 17.0.0

# Per-node permissions with a vanilla-level fallback (me.lucko, maven.nucleoid.xyz). 0.6.0-patbox
# declares `minecraft: >=1.21.11-beta`; the 0.3.1 we shipped on the 1.20.1 line does not load here.
fabric_permissions_version = 0.6.0-patbox

# Our forked PlayerEngine, built from ../engine and staged into libs/. Bump together with
# ../engine/gradle.properties — see the note in build.gradle about why this is pinned exactly.
playerengine_version = 1.21.11-1.0.26

# The version-neutral core, built from ../../ai-companion-memory and staged into libs/. The same
# release of this mod on a different Minecraft version pins the same number; that is the point.
memory_version = 0.5.0
