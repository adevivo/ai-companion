plugins {
    // Architectury Loom, not Fabric Loom, for a mod that only targets Fabric. Two reasons, both
    // practical: the engine is built with this exact version against this exact Minecraft, so one
    // proven toolchain covers both halves of the repo; and Loom version compatibility is the
    // sharpest edge in this whole build — Architectury Loom 1.11 silently cannot do 1.21.11 at all.
    // Pinned exactly for the same reason every version here is (see the PlayerEngine note below).
    id 'dev.architectury.loom' version '1.14.476'
}

group = project.maven_group
version = project.mod_version

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

loom {
    silentMojangMappingsLicense()

    runs {
        client {
            // Pin the dev username. Loom otherwise picks a random 'Player###' per launch, and an
            // offline-mode UUID is derived from the username — so every run is a different player.
            // That silently breaks anything keyed to player identity across a save/load, e.g. the
            // companion persists its owner's UUID and re-attaches its brain only for that player.
            programArgs '--username', 'Dev'
        }
    }
}

repositories {
    mavenCentral()
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }   // Cloth Config
    maven { name = 'Nucleoid'; url = 'https://maven.nucleoid.xyz/' }    // fabric-permissions-api
    maven {
        // Mod Menu (Terraformers' own maven 502s intermittently; Modrinth mirrors releases)
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    flatDir { dir 'libs' }   // engine/ PlayerEngine jar staged here
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Architectury API. The engine declares `architectury` in its own depends and does not nest it,
    // and its networking is Architectury's NetworkManager — a channel has a server half and a
    // client half and they must be the same API or the wire silently mistypes. Not include()d here:
    // whether the shipped jar nests it or asks the player to install it is Phase 6's call.
    modImplementation "dev.architectury:architectury-fabric:${architectury_api_version}"

    // Our forked PlayerEngine (built from ../engine, staged into libs/) — provides
    // com.player2.playerengine.* (PlayerEngineController, IAutomatone, etc.).
    // include(...) nests it into the built jar (JiJ) so the CurseForge download runs
    // standalone; the nested jar keeps its own LGPL-3.0 license (META-INF/LICENSE).
    //
    // ⚠️ Pinned, not '+'. Gradle caches dynamic-version resolution, so a rebuilt jar staged under
    // the same version is silently ignored — and with '+' that stayed true even after the version
    // moved, because the cached resolution was still considered fresh. It cost three separate
    // debugging sessions, once as a runtime NoSuchMethodError that vanished into a swallowed
    // Error. An exact version fails loudly at compile time instead. Bump this together with
    // ../engine/gradle.properties.
    include(modImplementation("libs:PlayerEngine:${playerengine_version}"))

    // The memory engine from ../../ai-companion-memory (built there, staged into libs/). Plain
    // Java 17 + Gson, no Minecraft and no Fabric, so Loom wraps the non-mod jar for JiJ. Gson is
    // deliberately not nested with it — Minecraft already ships Gson, and a second copy on the
    // classpath is a real hazard rather than a redundancy.
    //
    // The engine takes this compileOnly and relies on the mod to nest it, so there is exactly one
    // copy on the classloader. Two copies of the same scorer is the silent divergence the shared
    // core exists to prevent. Pinned exactly, for the reason above.
    include(implementation("libs:aicompanion-memory:${memory_version}"))

    // Per-node permissions for /companion. A ~5 KB API with no implementation of its own: with no
    // permissions mod installed every check falls back to the vanilla operator level, so this
    // changes nothing on a family LAN — and with LuckPerms present an operator can grant
    // aicompanion.command.spawn to a group instead of having to op everybody. A raw
    // hasPermissionLevel(2) offers an operator only "op or nothing", and no public server ops
    // everyone. JiJ'd (include) because the API classes must be on the classpath whether or not a
    // permissions mod is there to implement them.
    include(modImplementation("me.lucko:fabric-permissions-api:${fabric_permissions_version}"))

    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    // In-game config screen. Cloth Config builds the screen and is JiJ'd (include) so the
    // CurseForge jar stays self-contained; its POM pulls fabric-api, excluded to avoid clashing
    // with the version pinned above.
    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    include "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    // Mod Menu is compile-time only: we implement its ModMenuApi entrypoint, but the class is
    // loaded solely BY Mod Menu, so shipping without it is safe (fabric.mod.json 'suggests' it).
    // modLocalRuntime puts it in the dev client so the Mods-screen path is testable.
    modCompileOnly "maven.modrinth:modmenu:${modmenu_version}"
    modLocalRuntime "maven.modrinth:modmenu:${modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }

    // Bundle the repo's tts/ setup files so CompanionConfig can extract them to
    // config/aicompanion/tts/ on first load. The repo copy is the single source of truth.
    from(new File(projectDir, '../tts')) {
        include 'docker-compose.yml', 'README.md'
        into 'aicompanion/tts'
    }
}

// LGPL-3.0 requires the license text to travel with the binary, not just the source repo.
// LGPL-3.0 is drafted as an addendum to GPL-3.0, so both texts must ship.
tasks.named('jar') {
    from(projectDir) {
        include 'LICENSE', 'LICENSE.GPL-3.0.txt'
        into 'META-INF'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    // A port produces errors in the hundreds and javac stops at 100 by default. Seeing all of them
    // at once is what makes them sortable into categories instead of a queue.
    options.compilerArgs += ['-Xmaxerrs', '100000']
}
